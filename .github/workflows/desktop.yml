# Tests en cada cambio e instaladores para los tres sistemas. jpackage no compila de forma
# cruzada, así que cada instalador se genera en su propio sistema operativo.
# Al publicar una etiqueta "v*" (p. ej. v1.0.0) los instaladores se adjuntan a una Release.

name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:test --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            task: packageDmg
          - os: macos-15-intel    # Intel
            task: packageDmg
          - os: windows-latest
            task: packageMsi packageExe
          - os: ubuntu-latest
            task: packageDeb packageRpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - run: ./gradlew ${{ matrix.task }} --console=plain
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            app/build/compose/binaries/main/dmg/*.dmg
            app/build/compose/binaries/main/msi/*.msi
            app/build/compose/binaries/main/exe/*.exe
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Nombres distintos para los DMG de Apple Silicon e Intel
        run: |
          for f in dist/installers-macos-latest/*.dmg; do mv "$f" "${f%.dmg}-arm64.dmg"; done
          for f in dist/installers-macos-15-intel/*.dmg; do mv "$f" "${f%.dmg}-x64.dmg"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: true
